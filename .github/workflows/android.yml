name: Android Native Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/capacitor/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/capacitor/**'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: Build a signed Android App Bundle for Play Console upload
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @kognitika/capacitor sync:android
      - run: ./gradlew testDebugUnitTest --no-daemon
        working-directory: apps/capacitor/android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/capacitor/android

      - uses: actions/upload-artifact@v6
        with:
          name: kognitika-android-debug-${{ github.sha }}
          path: apps/capacitor/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  github-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: debug
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v6
        with:
          name: kognitika-android-debug-${{ github.sha }}
          path: apk

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv apk/app-debug.apk apk/kognitika-debug.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest apk/kognitika-debug.apk \
            --title "Kognitika Android (latest main)" \
            --notes "Automated debug build from main @ ${{ github.sha }}. For internal testing only; production releases go through Play Console." \
            --prerelease

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: debug
    runs-on: ubuntu-latest
    environment: android-release

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @kognitika/capacitor sync:android
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kognitika-release.jks"
          chmod 600 "$RUNNER_TEMP/kognitika-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/kognitika-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
      - run: ./gradlew bundleRelease --no-daemon
        working-directory: apps/capacitor/android

      - uses: actions/upload-artifact@v6
        with:
          name: kognitika-android-release-${{ github.sha }}
          path: apps/capacitor/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
