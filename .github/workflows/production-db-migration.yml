name: Production Database Migration

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Previously deployed commit SHA for the reviewed change set
        required: true
        type: string
      target_sha:
        description: Reviewed commit SHA to migrate
        required: true
        type: string
      db_change_runbook_id:
        description: Reviewed runbook identifier, for example PDD-DB-2026-08-02-175
        required: true
        type: string
      review_url:
        description: Reviewable xodapi/kognitika GitHub issue or pull-request URL containing backup evidence
        required: true
        type: string
      operation:
        description: "Apply committed migrations, or clean_rebuild after explicit destructive approval"
        required: true
        default: apply_migrations
        type: choice
        options:
          - apply_migrations
          - clean_rebuild
      destructive_confirmation:
        description: "Required for clean_rebuild: DELETE_PRODUCTION_DATA"
        required: false
        type: string
      verified_backup_reference:
        description: "Required for clean_rebuild: durable backup identifier already restore-tested"
        required: false
        type: string

concurrency:
  group: kognitika-production-db
  cancel-in-progress: false

jobs:
  migrate:
    # GitHub Environment approval is the external production-change boundary.
    environment: production-db-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Validate reviewed database change evidence
        env:
          DB_CHANGE_RUNBOOK_ID: ${{ inputs.db_change_runbook_id }}
          DB_CHANGE_REVIEW_URL: ${{ inputs.review_url }}
        run: node scripts/production-db-change-gate.mjs "${{ inputs.base_sha }}" "${{ inputs.target_sha }}"

      - name: Preflight migration history before incremental DDL
        if: inputs.operation == 'apply_migrations'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/check-migration-baseline.mjs

      - name: Prepare protected host connection
        if: inputs.operation == 'clean_rebuild'
        env:
          DEPLOY_HOST: ${{ secrets.KOGNITIKA_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.KOGNITIKA_DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.KOGNITIKA_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/kognitika_db_rebuild_key
          chmod 600 ~/.ssh/kognitika_db_rebuild_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Clean rebuild on protected host
        if: inputs.operation == 'clean_rebuild'
        env:
          DEPLOY_HOST: ${{ secrets.KOGNITIKA_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.KOGNITIKA_DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.KOGNITIKA_DEPLOY_USER }}
          EXPECTED_SHA: ${{ inputs.target_sha }}
          DESTRUCTIVE_CONFIRMATION: ${{ inputs.destructive_confirmation }}
          VERIFIED_BACKUP_REFERENCE: ${{ inputs.verified_backup_reference }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/kognitika_db_rebuild_key \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "EXPECTED_SHA='$EXPECTED_SHA' DESTRUCTIVE_CONFIRMATION='$DESTRUCTIVE_CONFIRMATION' VERIFIED_BACKUP_REFERENCE='$VERIFIED_BACKUP_REFERENCE' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          test "$DESTRUCTIVE_CONFIRMATION" = "DELETE_PRODUCTION_DATA"
          test -n "$VERIFIED_BACKUP_REFERENCE"
          case "$VERIFIED_BACKUP_REFERENCE" in
            *[!A-Za-z0-9._-]* | '') echo 'Invalid verified backup reference.' >&2; exit 1 ;;
          esac

          cd /opt/kognitika
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -r /opt/kognitika/.env
          set -a
          . /opt/kognitika/.env
          set +a
          test -n "${DATABASE_URL:-}"
          # Prisma accepts this query parameter; PostgreSQL client tools do not.
          DATABASE_URL="${DATABASE_URL%%\?schema=public}"

          # A durable archive and its actual restore test must already exist before
          # this destructive workflow. Do not accept a runner-local or list-only check.
          backup_dir=/opt/kognitika-db-backups
          backup_file="$backup_dir/${VERIFIED_BACKUP_REFERENCE}.dump"
          test -s "$backup_file"
          test -s "${backup_file}.sha256"
          (cd "$backup_dir" && sha256sum --check "$(basename "$backup_file").sha256")

          service_was_active=false
          if systemctl is-active --quiet kognitika; then
            service_was_active=true
          fi
          restore_service() {
            if "$service_was_active"; then
              sudo systemctl start kognitika || true
            fi
          }
          trap restore_service EXIT

          # The legacy pre-rebuild state intentionally has pending migrations. Do not
          # run migrate status until the fresh schema has been created and migrated.
          command -v docker >/dev/null
          client_image=postgres:16
          client() {
            docker run --rm --network host -e DATABASE_URL "$client_image" "$@"
          }

          sudo systemctl stop kognitika
          client psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --command 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate status

          if "$service_was_active"; then
            sudo systemctl start kognitika
            health_url=http://127.0.0.1:3006/api/health
            for attempt in $(seq 1 30); do
              if health="$(curl -fsS "$health_url" 2>/dev/null)"; then
                break
              fi
              sleep 2
            done
            test -n "${health:-}"
            printf '%s' "$health" | grep -q '"status":"ok"'
          fi
          trap - EXIT
          REMOTE
