name: Production Database Migration

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Previously deployed commit SHA for the reviewed change set
        required: true
        type: string
      target_sha:
        description: Reviewed commit SHA to migrate
        required: true
        type: string
      db_change_runbook_id:
        description: Reviewed runbook identifier, for example PDD-DB-2026-08-02-165
        required: true
        type: string
      review_url:
        description: Reviewable xodapi/kognitika GitHub issue or pull-request URL
        required: true
        type: string
      operation:
        description: "Apply committed migrations, or clean_rebuild after explicit destructive approval"
        required: true
        default: apply_migrations
        type: choice
        options:
          - apply_migrations
          - clean_rebuild
      destructive_confirmation:
        description: "Required for clean_rebuild: DELETE_PRODUCTION_DATA"
        required: false
        type: string
      verified_backup_reference:
        description: "Required for clean_rebuild: verified disposable restore evidence identifier"
        required: false
        type: string

concurrency:
  group: kognitika-production-db
  cancel-in-progress: false

jobs:
  migrate:
    # Configure this Environment with required human reviewers outside this repository.
    environment: production-db-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Scope this secret exclusively to the protected production-db-changes Environment.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.22.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Validate reviewed database change evidence
        env:
          DB_CHANGE_RUNBOOK_ID: ${{ inputs.db_change_runbook_id }}
          DB_CHANGE_REVIEW_URL: ${{ inputs.review_url }}
        run: node scripts/production-db-change-gate.mjs "${{ inputs.base_sha }}" "${{ inputs.target_sha }}"

      - name: Preflight migration history before incremental DDL
        if: inputs.operation == 'apply_migrations'
        run: node scripts/check-migration-baseline.mjs

      - name: Validate clean rebuild acknowledgement
        if: inputs.operation == 'clean_rebuild'
        env:
          DESTRUCTIVE_CONFIRMATION: ${{ inputs.destructive_confirmation }}
          VERIFIED_BACKUP_REFERENCE: ${{ inputs.verified_backup_reference }}
        run: |
          set -euo pipefail
          test "$DESTRUCTIVE_CONFIRMATION" = "DELETE_PRODUCTION_DATA"
          test -n "$VERIFIED_BACKUP_REFERENCE"

      - name: Record verified backup boundary
        if: inputs.operation == 'clean_rebuild'
        env:
          VERIFIED_BACKUP_REFERENCE: ${{ inputs.verified_backup_reference }}
        run: |
          set -euo pipefail
          # The reference must identify an archive that was restored successfully outside
          # GitHub Actions. A runner-local backup would disappear after this job and is not
          # an acceptable recovery path.
          printf 'Using pre-verified durable backup reference: %s\n' "$VERIFIED_BACKUP_REFERENCE"

      - name: Reset production schema after verified backup
        if: inputs.operation == 'clean_rebuild'
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --command 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'

      - name: Apply committed database migrations
        run: pnpm exec prisma migrate deploy

      - name: Verify fresh database migration status
        run: pnpm exec prisma migrate status
