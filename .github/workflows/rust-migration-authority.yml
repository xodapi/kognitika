name: Rust migration authority contract

on:
  push:
    paths:
      - 'contracts/rust-postgresql-migration-authority.json'
      - 'docs/rust-postgresql-migration-authority.md'
      - 'src/tests/rust-migration-authority-contract.test.ts'
      - '.github/workflows/rust-migration-authority.yml'
  pull_request:
    paths:
      - 'contracts/rust-postgresql-migration-authority.json'
      - 'docs/rust-postgresql-migration-authority.md'
      - 'src/tests/rust-migration-authority-contract.test.ts'
      - '.github/workflows/rust-migration-authority.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.22.0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test src/tests/rust-migration-authority-contract.test.ts
      - run: pnpm typecheck:tests
