services:
  db:
    image: postgres:15
    container_name: cognitika_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kognitika}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cognitika"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: cognitika_app
    ports:
      - "3006:3006"
    environment:
      - DATABASE_URL=**************************************@db:5432/${POSTGRES_DB:-kognitika}?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - NODE_ENV=production
      - PORT=3006
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3006}
      - APP_URL=${APP_URL:-http://localhost:3006}
      - GAME_SAVE_LEGACY_COMPAT_ENABLED=${GAME_SAVE_LEGACY_COMPAT_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
