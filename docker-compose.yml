services:
  db:
    image: postgres:15
    container_name: cognitika_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kognitika}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  analytics-sidecar:
    build:
      context: .
      dockerfile: crates/kognitika-analytics-sidecar/Dockerfile
    environment:
      ANALYTICS_SIDECAR_ADDR: 0.0.0.0:3010
    # Internal-only: no host port, database credentials, app secrets, or volumes.
    # The Node app can reach this service only on the Compose network.

  app:
    build: .
    container_name: cognitika_app
    ports:
      - "127.0.0.1:3006:3006"
    environment:
      - DATABASE_URL=**************************************@db:5432/${POSTGRES_DB:-kognitika}?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - NODE_ENV=production
      - PORT=3006
      - LISTEN_HOST=0.0.0.0
      - TRUST_PROXY=loopback
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3006}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ADMIN_CHAT_ID=${TELEGRAM_ADMIN_CHAT_ID:-}
      - APP_URL=${APP_URL:-http://localhost:3006}
      - GAME_SAVE_LEGACY_COMPAT_ENABLED=${GAME_SAVE_LEGACY_COMPAT_ENABLED:-false}
      - GAME_ATTEMPT_TTL_SECONDS=${GAME_ATTEMPT_TTL_SECONDS:-900}
      - GAME_ATTEMPT_NOT_BEFORE_MS=${GAME_ATTEMPT_NOT_BEFORE_MS:-0}
      - ANALYTICS_OUTBOX_SHADOW_ENABLED=${ANALYTICS_OUTBOX_SHADOW_ENABLED:-false}
      - ANALYTICS_OUTBOX_DISPATCH_ENABLED=${ANALYTICS_OUTBOX_DISPATCH_ENABLED:-false}
      - RUST_ANALYTICS_SIDECAR_ENABLED=${RUST_ANALYTICS_SIDECAR_ENABLED:-false}
      - RUST_ANALYTICS_SIDECAR_URL=http://analytics-sidecar:3010
      - RUST_ANALYTICS_SIDECAR_TIMEOUT_MS=${RUST_ANALYTICS_SIDECAR_TIMEOUT_MS:-1000}
      - RUST_ANALYTICS_SIDECAR_ROLLOUT_PERCENT=${RUST_ANALYTICS_SIDECAR_ROLLOUT_PERCENT:-0}
    depends_on:
      db:
        condition: service_healthy
      analytics-sidecar:
        condition: service_started

volumes:
  pgdata:
