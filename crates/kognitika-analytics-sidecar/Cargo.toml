[package]
name = "kognitika-analytics-sidecar"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "kognitika-analytics-sidecar"

[dependencies]
axum = "0.8"
kognitika-core = { path = "../kognitika-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["timeout", "util"] }
http-body-util = "0.1"
