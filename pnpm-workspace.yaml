packages:
  - "."
  - "apps/*"
  - "packages/*"

# pnpm v10 location for allowed dependency build scripts.
# package.json's "pnpm" field is no longer read by pnpm v10.
onlyBuiltDependencies:
  - "@prisma/engines"
  - "@prisma/client"
  - "esbuild"
  - "prisma"
  - "protobufjs"

overrides:
  fast-uri: 3.1.5
  hono: 4.12.25
  ip-address: 10.5.0
  js-yaml: 4.3.1
  socket.io-parser: 4.2.7
  ws@>=8.0.0: 8.21.3
