services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: laboratory
      POSTGRES_PASSWORD: laboratory
      POSTGRES_DB: laboratory
    volumes:
      - ${LAB_ROOT:?LAB_ROOT is required}:/workspace:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laboratory -d laboratory"]
      interval: 2s
      timeout: 2s
      retries: 45
